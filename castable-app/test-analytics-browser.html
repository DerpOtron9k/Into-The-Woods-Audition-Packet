<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Test</title>
</head>
<body>
    <h1>Analytics Test Page</h1>
    <button id="testEvent">Test Analytics Event</button>
    <div id="results"></div>

    <script>
        // Mock gtag function
        window.gtag = function(command, eventName, parameters) {
            console.log('Analytics event:', { command, eventName, parameters });
            document.getElementById('results').innerHTML += 
                `<p>Event: ${eventName}, Parameters: ${JSON.stringify(parameters)}</p>`;
        };

        // Test analytics functions
        function testAnalytics() {
            // Simulate the analytics functions from our lib
            function trackEvent(eventName, properties) {
                if (typeof window !== 'undefined' && window.gtag) {
                    window.gtag('event', eventName, properties);
                }
            }

            function trackShowCreated(showId, showTitle) {
                trackEvent('show_created', {
                    show_id: showId,
                    show_title: showTitle,
                    timestamp: new Date().toISOString(),
                });
            }

            function trackShowViewed(showId, showTitle) {
                trackEvent('show_viewed', {
                    show_id: showId,
                    show_title: showTitle,
                    timestamp: new Date().toISOString(),
                });
            }

            // Test events
            trackShowCreated('test-123', 'Test Show');
            trackShowViewed('test-123', 'Test Show');
            trackEvent('test_event', { test: true });
        }

        document.getElementById('testEvent').addEventListener('click', testAnalytics);
    </script>
</body>
</html>
